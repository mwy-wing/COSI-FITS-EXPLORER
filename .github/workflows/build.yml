name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libcfitsio-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config cfitsio
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build core, CLI, tests, and macOS app when available
        run: cmake --build build --parallel 3
      - name: Test readers, workflows, and public demo
        run: ctest --test-dir build --output-on-failure
      - name: Compile demo generator and check overwrite protection
        shell: bash
        run: |
          cmake --build build --target cosi-make-demo
          ./build/cosi-make-demo build/generated-demo.fits
          ./build/cosi-demo-tests build/generated-demo.fits
          if ./build/cosi-make-demo build/generated-demo.fits; then
            echo "Generator unexpectedly overwrote an existing file" >&2
            exit 1
          fi
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
